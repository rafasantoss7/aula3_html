<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2 Tabelas</title>
    </head>
    <body>
        <header>
        <h1 style="text-align: center; color: rgb(249, 3, 3);">Almoço do SESI</h1>   
        <hr> 
        </header>
        <main>
            <!-- Iniciando tabela -->
            <!-- Border -> borda da tabela-->
            <!--Widht:100% indica que a tabela preenche a tela inteira-->
            <table border="1" style="width: 100%;">
                <!-- Título da tabela-->
                 <caption>Comidas do SESI</caption>
                <!--Cabecalho da tabela-->
                <thead>
                    <!--Primeira linha do cabecalho-->
                    <tr>
                        <!--Colspan mescla as colunas da tabela-->
                        <th colspan="6">Dias da Semana</th>
                    </tr>
                    <!--Segunda linha do cabecalho-->
                    <tr>
                        <th>Informações</th>
                        <th>Segunda-feira</th>
                        <th>Terça-feira</th>
                        <th>Quarta-feira</th>
                        <th>Quinta-feira</th>
                        <th>Sexta-feira</th>
                    </tr>
                </thead>
                <!--Corpo da tabela-->
                <tbody>
                     <!--Primeira linha do corpo da tabela-->
                    <tr>
                        <!--Rowspaw mescla as linhas da tabela-->
                        <td rowspan="2" style="background-image:url('https://static.vecteezy.com/ti/vetor-gratis/p1/53983434-horizontal-fundo-com-romantico-simbolos-e-uma-lugar-colocar-para-texto-vetor.jpg') ;">Informações nutricionais</td>
                        <td colspan="5" style="text-align: center;"><b>Arroz + Feijão</b></td>
                    </tr>
                    <tr>
                        <td>Carne</td>
                        <td>Frango grelhado</td>
                        <td>Omelete</td>
                        <td>Sobrecoxa assada</td>
                        <td>Strogonoff</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
