<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela colorida</title>
</head>
<body>
    <table border="1" style="width: 75%;">
        <tr>
            <th colspan="2" style="background-color: purple; color: white;">Cabeçalho 1</th>
            <th colspan="2" style="background-color: purple; color: white;">Cabeçalho 2</th>
            <th colspan="2" style="background-color: purple; color: white;">Cabeçalho 3</th>
        </tr>
        <tr>
            <td rowspan="2" colspan="2" style="background-color: black; color: white;">Conteúdo 1</td>
            <td style="background-color: yellow;">1</td>
            <td style="text-align: right; background-color: red;">2</td>
            <td rowspan="2" colspan="2" style="background-image: url(https://previews.123rf.com/images/ellagraphic/ellagraphic1802/ellagraphic180200004/96606123-colors-in-a-row.jpg://i.pinimg.com/736x/43/a8/0d/43a80d6f2ac1662d11359d69876c6a2b.jpg);">Conteúdo 3</td>
        </tr>
        <tr>
            <td style="text-align: right; background-color: blue;">3</td>
            <td style="background-color: greenyellow;">4</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="2" style="background-color: black; color: white;">Conteúdo 4</td>
            <td rowspan="2" colspan="2" style="text-align: right; background-image: url(https://images.tcdn.com.br/img/img_prod/898929/tecido_tricoline_estampado_chevron_cinza_50cm_x_1_50mt_1165_1_c43c2d9b0a11e34d8888eafe4d1a2f44.png);">Conteúdo 5</td>
            <td style="text-align: center; background-color: orange;">5</td>
            <td style="background-color: rgb(247, 133, 255);">6</td>
        </tr>
        <tr>
            <td style="text-align: right; background-color: rgb(255, 0, 106);">7</td>
            <td style="text-align: center; background-color: orange;">8</td>
        </tr>
    </table>
</body>
</html>
